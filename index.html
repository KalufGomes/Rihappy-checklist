<title>Checklist da Loja</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --navy:#051E34; --navy-2:#23345C; --gold:#B8912F; --gold-soft:#F3E7C6;
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#EBEEF4; --line:#D9DEE8;
  --ink:#141B2D; --ink-2:#4A546B; --ink-3:#7A8398;
  --good:#1E7A4C; --good-bg:#E3F3EA; --warn:#9A6A12; --warn-bg:#FBF0D9; --crit:#B3261E; --crit-bg:#FBE6E4;
  --h0:#EEF0F5; --h1:#F7D9CF; --h2:#EDA992; --h3:#D86E50; --h4:#A83D25;
  --on-status:#FFFFFF; --bar:#23345C; --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.06);
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1322; --surface:#151D31; --surface-2:#1C2640; --line:#2A3654;
    --ink:#E9EDF6; --ink-2:#AEB7CB; --ink-3:#7F89A1; --gold:#D8B45A; --gold-soft:#3A3120;
    --good:#5CC48F; --good-bg:#15311F; --warn:#E3B04F; --warn-bg:#352812; --crit:#F0766B; --crit-bg:#3C1A18;
    --h0:#1C2640; --h1:#4A2A25; --h2:#7A3A2B; --h3:#B8553A; --h4:#EC8A6B;
    --on-status:#0D1322; --bar:#8FA3D6; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#151D31; --surface-2:#1C2640; --line:#2A3654;
  --ink:#E9EDF6; --ink-2:#AEB7CB; --ink-3:#7F89A1; --gold:#D8B45A; --gold-soft:#3A3120;
  --good:#5CC48F; --good-bg:#15311F; --warn:#E3B04F; --warn-bg:#352812; --crit:#F0766B; --crit-bg:#3C1A18;
  --h0:#1C2640; --h1:#4A2A25; --h2:#7A3A2B; --h3:#B8553A; --h4:#EC8A6B;
  --on-status:#0D1322; --bar:#8FA3D6; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.demo-bar{background:var(--gold);color:#14213D;text-align:center;font-weight:600;font-size:13px;padding:6px 16px}

/* ---------- topo ---------- */
.top{background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand .kg{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:700;letter-spacing:.02em;color:#fff;white-space:nowrap}
.brand .kg b{color:#D8B45A;font-weight:700}
.brand img{height:56px;width:auto;max-width:150px;object-fit:contain;border-radius:8px}
.brand img.lg-loja{background:#fff;padding:2px;width:48px;height:48px}
.user{flex-shrink:0}
.brand .sep{width:1px;height:30px;background:rgba(255,255,255,.25)}
.brand .loja{font-size:13px;color:#C9D1E4;line-height:1.2}
.brand .loja strong{display:block;color:#fff;font-size:15px}
.user{display:flex;align-items:center;gap:8px;font-size:13px;color:#C9D1E4}
.user button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:5px 10px;font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{background:transparent;border:0;color:#C9D1E4;padding:10px 14px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#D8B45A}
main{padding-block:18px 110px}

/* ---------- comuns ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px;font-weight:700}
.card-h small{color:var(--ink-3);font-size:12.5px;min-width:0;flex:1 1 180px;text-align:right}
.card-b{padding:12px 16px 16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#14213D}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:38px;width:100%}
.inp:focus{border-color:var(--gold);outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-3)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.neu{background:var(--surface-2);color:var(--ink-2)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.empty{padding:26px;text-align:center;color:var(--ink-3)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
#toast.err{background:var(--crit)}
#loading{position:fixed;inset:0;background:rgba(13,19,34,.25);display:grid;place-items:center;z-index:55}
#loading div{background:var(--surface);padding:14px 20px;border-radius:10px;font-weight:600}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--navy)}
.login-in{width:100%;max-width:380px;display:grid;gap:18px;justify-items:center}
.login-logo{width:220px;max-width:70%;height:auto}
.login .box{width:100%;max-width:380px;background:var(--surface);border-radius:14px;padding:28px 24px;display:grid;gap:14px}
.login .kg{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:700;color:var(--ink);line-height:1}
.login .kg b{color:var(--gold)}
.login .gold-rule{width:44px;height:3px;background:var(--gold);border-radius:2px}

/* ---------- conferência ---------- */
.conf-top{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:14px}
.datebox{display:flex;align-items:center;gap:6px}
.datebox .btn{padding:8px 11px}
.daylabel{font-weight:700;font-size:18px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:16px}
.person{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;position:relative}
.person .n{font-weight:700}
.person .g{font-size:12px;color:var(--ink-3)}
.person .s{font-size:12px;font-weight:600;margin-top:4px}
.person.done{border-color:var(--good)}
.person.done .s{color:var(--good)}
.person.pend .s{color:var(--warn)}
.person[aria-pressed="true"]{outline:2px solid var(--navy);outline-offset:-1px;background:var(--surface-2)}
:root[data-theme="dark"] .person[aria-pressed="true"]{outline-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .person[aria-pressed="true"]{outline-color:var(--gold)}}
.group-title{grid-column:1/-1;margin-top:4px}
.presence{display:flex;gap:6px;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px}
.seg[aria-pressed="true"].p-presente{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.seg[aria-pressed="true"].p-folga{background:var(--surface-2);border-color:var(--ink-2)}
.seg[aria-pressed="true"].p-falta_sem_motivo{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.seg[aria-pressed="true"].p-falta_justificada{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.bloco{margin-top:14px}
.bloco h4{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);font-weight:800}
.task{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task .d{font-weight:500}
.task .d small{display:block;color:var(--ink-3);font-weight:400;font-size:12.5px}
.task.falhou .d{color:var(--crit)}
.tri{display:flex;gap:4px}
.tri button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;font-size:13px;font-weight:600;min-width:44px}
.tri button[aria-pressed="true"].ok{background:var(--good);border-color:var(--good);color:var(--on-status)}
.tri button[aria-pressed="true"].no{background:var(--crit);border-color:var(--crit);color:var(--on-status)}
.tri button[aria-pressed="true"].na{background:var(--ink-2);border-color:var(--ink-2);color:var(--surface)}
.meta-inp{display:flex;align-items:center;gap:6px}
.meta-inp input{width:64px;text-align:center}
.meta-inp .stp{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.obs-btn{border:0;background:none;color:var(--ink-3);font-size:12.5px;padding:0;text-decoration:underline;text-underline-offset:2px}
.obs-in{grid-column:1/-1}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:40}
.savebar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0}
.notice{border-radius:8px;padding:9px 12px;font-size:13.5px;margin-top:10px}
.notice.good{background:var(--good-bg);color:var(--good)}
.notice.info{background:var(--surface-2);color:var(--ink-2)}

/* ---------- placar ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{padding:14px 16px;display:grid;gap:2px;align-content:start}
.kpi .v{font-size:32px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.kpi .v small{font-size:15px;font-weight:600;color:var(--ink-3)}
.kpi .l{font-size:13px;color:var(--ink-2);font-weight:600}
.kpi .x{font-size:12.5px;color:var(--ink-3)}
.kpi.hero{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.hero .l,.kpi.hero .x{color:#C9D1E4}
.kpi .long{font-size:17px;font-weight:700;line-height:1.25}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:14px}
.grid2>*,.kpis>*{min-width:0}
.rank{width:100%;border-collapse:collapse}
.rank td,.rank th{padding:9px 6px;border-top:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}
.rank th{border-top:0;font-size:12px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.rank tr.click{cursor:pointer}
.rank tr.click:hover td{background:var(--surface-2)}
.rank .pos{width:26px;color:var(--ink-3);font-weight:700}
.rank .who b{display:block}
.rank .who span{font-size:12px;color:var(--ink-3)}
.track{position:relative;height:10px;background:var(--surface-2);border-radius:5px;min-width:80px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center;margin-bottom:9px}
.hb .t{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t small{color:var(--ink-3)}
.hb .c{font-weight:700;font-size:13.5px}
.hb .track{grid-column:1/-1;height:8px}
.hb .track i{background:var(--h3);border-radius:0 4px 4px 0}
.heat{overflow-x:auto}
.heat table{border-collapse:separate;border-spacing:3px;width:100%;min-width:420px}
.heat th{font-size:12px;color:var(--ink-3);font-weight:600;text-align:center;padding:2px}
.heat th.nm{text-align:left;font-size:13px;color:var(--ink);font-weight:600;white-space:nowrap;padding-right:8px}
.heat td{height:34px;border-radius:5px;text-align:center;font-size:12.5px;font-weight:700}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);margin-top:8px;flex-wrap:wrap}
.legend i{width:18px;height:10px;border-radius:3px;display:inline-block}
.vbars{display:flex;align-items:end;gap:6px;height:150px;padding-top:18px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;min-width:0}
.vbar .bw{flex:1;width:100%;max-width:46px;position:relative}
.vbar .b{position:absolute;left:0;right:0;bottom:0;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.vbar .c{font-size:12px;font-weight:700}
.vbar .x{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.metas{display:grid;gap:10px}
.metarow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.metarow .track{grid-column:1/-1;height:8px}
.detail{width:100%;border-collapse:collapse}
.detail td,.detail th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;font-size:13.5px;vertical-align:top}
.detail th{border-top:0;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.scroll{overflow-x:auto}
.scroll-y{max-height:420px;overflow:auto}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;padding:6px 9px;border-radius:6px;z-index:70;max-width:240px;line-height:1.35}

/* ---------- cadastros ---------- */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.list{width:100%;border-collapse:collapse}
.list td,.list th{padding:9px 8px;border-top:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}
.list th{border-top:0;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.list tr.off td{color:var(--ink-3)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.modal-bg{position:fixed;inset:0;background:rgba(13,19,34,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:14px;padding:20px;display:grid;gap:12px}
.modal h3{margin:0}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:500;color:var(--ink)}
.logo-slot{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-slot .pv{width:110px;height:110px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;background:#fff;overflow:hidden}
.logo-slot .pv img{max-width:100%;max-height:100%}

@media (max-width:860px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:520px){
  .brand .kg{font-size:20px}
  .brand .loja,.brand .sep,.user span{display:none}
  .brand img{height:48px}
  .brand img.lg-loja{width:42px;height:42px}
  .kpi .v{font-size:26px}
  .task{grid-template-columns:1fr}
  .tri{justify-content:flex-start}
  .rank .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<div id="tip" hidden></div>
<div id="toast" hidden></div>
<div id="loading" hidden><div>Carregando…</div></div>

<script>
/* =========================================================

var NO_GOOGLE = typeof google !== 'undefined' && google.script && google.script.run;
var DEMO = !API_URL && !NO_GOOGLE;

function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (API_URL && !NO_GOOGLE) {
    return fetch(API_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args })
    }).then(function (r) {
      if (!r.ok) throw new Error('Sem conexão com o servidor (' + r.status + ').');
      return r.json();
    }, function () {
      throw new Error('Sem conexão com o servidor. Verifique a internet e tente de novo.');
    }).then(function (j) {
      if (!j.ok) throw new Error(j.erro);
      return j.dados;
    });
  }
  if (DEMO) {
    return new Promise(function (res, rej) {
      setTimeout(function () {
        try { res(JSON.parse(JSON.stringify(Demo[fn].apply(null, args)))); } catch (e) { rej(e); }
      }, 120);
    });
  }
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
    r[fn].apply(r, args);
  });
}

/* =========================================================
   Utilitários
   ========================================================= */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
function hoje() { return iso(new Date()); }
function dow(s) { return (parse(s).getDay() + 6) % 7; } // 0 = segunda
function inicioSemana(s) { return addDays(s, -dow(s)); }
function fimSemana(s) { return addDays(inicioSemana(s), 6); }
function br(s) { if (!s) return '—'; var p = s.split('-'); return p[2] + '/' + p[1]; }
function brAno(s) { if (!s) return '—'; var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

function $$(sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); }

function toast(msg, erro) {

}

/* =========================================================
   Regras de negócio (usadas na conferência e no placar)
   ========================================================= */
function ativoEm(c, data) {
  if (c.admissao && data < c.admissao) return false;
  if (c.desligamento && data > c.desligamento) return false;
  return true;
}
function tarefasDo(c, data, freq) {
  return S.base.tarefas.filter(function (t) {
    if (freq && t.frequencia !== freq) return false;
    if (t.grupos.split(',').indexOf(c.grupo) < 0) return false;
    if (t.criadaEm && data < t.criadaEm) return false;
    if (t.desativadaEm && data >= t.desativadaEm) return false;
    return true;
  }).sort(function (a, b) { return Number(a.ordem) - Number(b.ordem); });
}
function agruparBlocos(lista) {
  var ordem = [], m = {};
  lista.forEach(function (t) { if (!m[t.bloco]) { m[t.bloco] = []; ordem.push(t.bloco); } m[t.bloco].push(t); });
  return ordem.map(function (b) { return { bloco: b, tarefas: m[b] }; });
}
function colab(id) { return S.base.colaboradores.filter(function (c) { return c.id === id; })[0]; }
function tarefa(id) { return S.base.tarefas.filter(function (t) { return t.id === id; })[0]; }

/** Calcula o placar do período para a lista de colaboradores. */
function calcularPlacar(ini, fim, dados, lista) {
  var hj = hoje(), limite = fim < hj ? fim : hj;
  var conf = {}, reg = {};
  dados.conferencias.forEach(function (c) { conf[c.data + '|' + c.colabId] = c; });
  dados.registros.forEach(function (r) { reg[r.data + '|' + r.colabId + '|' + r.tarefaId] = r; });

  var out = { pessoas: [], falhas: [], ausencias: [], porTarefa: {}, porSemana: {}, metas: {} };
  lista.forEach(function (c) {
    var p = { c: c, oport: 0, feitas: 0, falhas: 0, na: 0, faltasSM: 0, faltasJ: 0, folgas: 0, pendentes: 0, dias: 0, heat: [0, 0, 0, 0, 0, 0, 0] };
    function falha(d, t, motivo) {
      p.falhas++; p.heat[dow(d)]++;
      out.falhas.push({ data: d, c: c, t: t, motivo: motivo });
      if (motivo !== 'Falta sem motivo') out.porTarefa[t.descricao + '|' + t.bloco] = (out.porTarefa[t.descricao + '|' + t.bloco] || 0) + 1;
      var ws = inicioSemana(d); out.porSemana[ws] = (out.porSemana[ws] || 0) + 1;
    }
    for (var d = ini; d <= limite; d = addDays(d, 1)) {
      if (!ativoEm(c, d)) continue;
      var cf = conf[d + '|' + c.id];
      if (!cf) { if (d < hj) p.pendentes++; continue; }
      if (cf.tipo === 'folga') { p.folgas++; out.ausencias.push({ data: d, c: c, tipo: cf.tipo, obs: cf.obs }); continue; }
      if (cf.tipo === 'falta_justificada') { p.faltasJ++; out.ausencias.push({ data: d, c: c, tipo: cf.tipo, obs: cf.obs }); continue; }
      p.dias++;
      var falta = cf.tipo === 'falta_sem_motivo';
      if (falta) { p.faltasSM++; out.ausencias.push({ data: d, c: c, tipo: cf.tipo, obs: cf.obs }); }
      tarefasDo(c, d, 'diaria').forEach(function (t) {
        var r = reg[d + '|' + c.id + '|' + t.id];
        if (t.tipo === 'meta') {
          var meta = Number(t.meta) || 1, q = falta ? 0 : (r ? Number(r.qtd) || 0 : null);
          if (q === null) return;
          var k = c.id + '|' + t.id;
          var m = out.metas[k] || (out.metas[k] = { c: c, t: t, real: 0, meta: 0, dias: 0, batidas: 0 });
          m.real += q; m.meta += meta; m.dias++; if (q >= meta) m.batidas++;
          p.oport++;
          if (q >= meta) p.feitas++; else falha(d, t, falta ? 'Falta sem motivo' : q + ' de ' + meta + (r && r.obs ? ' · ' + r.obs : ''));
          return;
        }
        if (falta) { p.oport++; falha(d, t, 'Falta sem motivo'); return; }
        if (r && r.status === 'na') { p.na++; return; }
        p.oport++;
        if (r && r.status === 'nao_feito') falha(d, t, r.obs || ''); else p.feitas++;
      });
    }
    // tarefas semanais: contam 1 vez por semana (semana termina no domingo)
    for (var ws = inicioSemana(ini); ws <= fim; ws = addDays(ws, 7)) {
      var we = addDays(ws, 6);
      if (we < ini || we > fim) continue;
      tarefasDo(c, we, 'semanal').forEach(function (t) {
        var feito = false, trabalhou = false;
        for (var x = ws; x <= we; x = addDays(x, 1)) {
          var r = reg[x + '|' + c.id + '|' + t.id]; if (r && r.status === 'feito') feito = true;
          var cf = conf[x + '|' + c.id]; if (cf && (cf.tipo === 'presente' || cf.tipo === 'falta_sem_motivo') && ativoEm(c, x)) trabalhou = true;
        }
        if (feito) { p.oport++; p.feitas++; }
        else if (trabalhou && we < hj) { p.oport++; falha(we, t, 'Não foi feita na semana'); }
      });
    }
    p.pct = p.oport ? p.feitas / p.oport : null;
    out.pessoas.push(p);
  });
  out.pessoas.sort(function (a, b) {
    var pa = a.pct == null ? 2 : a.pct, pb = b.pct == null ? 2 : b.pct;
    return pb - pa || a.falhas - b.falhas || a.c.nome.localeCompare(b.c.nome);
  });
  out.falhas.sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : a.c.nome.localeCompare(b.c.nome); });
  out.ausencias.sort(function (a, b) { return a.data < b.data ? 1 : -1; });
  return out;
}

  $('#fLogin').addEventListener('submit', function (e) {

    api('login', $('#lUser').value, $('#lPass').value).then(function (r) {
      S.token = r.token;
      try { sessionStorage.setItem('ckToken', r.token); } catch (x) {}
      return api('carregarBase', S.token);
    }).then(function (b) { S.base = b; carregando(false); S.aba = 'conf'; renderApp(); }).catch(falhaApi);
  });
}

function renderApp() {
  var u = S.base.usuario, cfg = S.base.config;
  var logoKG = '<img class="lg-kg" src="' + (cfg.logoKG || LOGO_KG_PADRAO) + '" alt="Kaluf & Gomes">';
  var logoLoja = '<img class="lg-loja" src="' + (cfg.logoLoja || LOGO_LOJA_PADRAO) + '" alt="' + esc(cfg.nomeLoja) + '">';
  var abas = [['conf', 'Conferência'], ['placar', 'Placar']];
  if (u.perfil === 'gerente') abas.push(['cad', 'Cadastros']);
  $('#app').innerHTML =
    (DEMO ? '<div class="demo-bar">Demonstração com dados fictícios</div>' : '') +
    '<header class="top"><div class="wrap">' +
      '<div class="brand">' + logoKG + '<span class="sep"></span>' + logoLoja +
        '<div class="loja"><strong>' + esc(cfg.nomeLoja || 'Loja') + '</strong>Checklist de obrigações</div></div>' +
      '<div class="user"><span>' + esc(u.nome) + '</span><button id="bSenha">Trocar senha</button><button id="bSair">Sair</button></div>' +
    '</div><div class="wrap"><nav class="tabs" role="tablist">' +
      abas.map(function (a) { return '<button role="tab" data-aba="' + a[0] + '" aria-selected="' + (S.aba === a[0]) + '">' + a[1] + '</button>'; }).join('') +
    '</nav></div></header><main class="wrap" id="view"></main><div id="savebarSlot"></div>';
  $$('.tabs button').forEach(function (b) { b.onclick = function () { S.aba = b.dataset.aba; renderApp(); }; });
  $('#bSair').onclick = function () { api('sair', S.token); S.token = null; try { sessionStorage.removeItem('ckToken'); } catch (x) {} renderLogin(); };
  $('#bSenha').onclick = modalSenha;
  if (S.aba === 'conf') renderConf();
  else if (S.aba === 'placar') renderPlacar();
  else renderCad();
}

/* ---------------- CONFERÊNCIA ---------------- */
function carregarSemana(data) {
  var ws = inicioSemana(data);
  if (S.conf.semana[ws]) return Promise.resolve(S.conf.semana[ws]);
  carregando(true);
  return api('carregarPeriodo', S.token, ws, addDays(ws, 6)).then(function (d) { carregando(false); S.conf.semana[ws] = d; return d; });
}

function renderConf() {
  var data = S.conf.data;
  carregarSemana(data).then(function (sem) { desenharConf(sem); }).catch(falhaApi);
}

function desenharConf(sem) {
  var data = S.conf.data, hj = hoje();
  var confDia = {}; sem.conferencias.forEach(function (c) { if (c.data === data) confDia[c.colabId] = c; });
  var lista = S.base.colaboradores.filter(function (c) { return ativoEm(c, data) && (c.ativo === 'sim' || (c.desligamento && data <= c.desligamento)); });
  var grupos = S.base.grupos.slice();
  lista.forEach(function (c) { if (grupos.indexOf(c.grupo) < 0) grupos.push(c.grupo); });
  if (S.conf.colabId && !lista.some(function (c) { return c.id === S.conf.colabId; })) S.conf.colabId = null;
  var feitos = lista.filter(function (c) { return confDia[c.id]; }).length;
  var dd = parse(data);

  var h = '<div class="conf-top">' +
    '<div><div class="eyebrow">Dia da conferência</div><div class="daylabel">' + DIAS_LONGO[dow(data)] + ', ' + dd.getDate() + ' de ' + MESES[dd.getMonth()] + '</div></div>' +
    '<div class="datebox"><button class="btn" id="dPrev" aria-label="Dia anterior">‹</button>' +
    '<input class="inp" type="date" id="dData" value="' + data + '" max="' + hj + '" style="width:auto">' +
    '<button class="btn" id="dNext" aria-label="Próximo dia"' + (data >= hj ? ' disabled' : '') + '>›</button>' +
    (data !== hj ? '<button class="btn sm" id="dHoje">Hoje</button>' : '') + '</div>' +
    '<div style="margin-left:auto" class="pill ' + (feitos === lista.length && lista.length ? 'good' : 'warn') + '">' + feitos + ' de ' + lista.length + ' conferidos</div>' +
  '</div><div class="people">';
  grupos.forEach(function (g) {
    var dog = lista.filter(function (c) { return c.grupo === g; });
    if (!dog.length) return;
    h += '<div class="group-title eyebrow">' + esc(g) + '</div>';
    dog.forEach(function (c) {
      var cf = confDia[c.id];
      h += '<button class="person ' + (cf ? 'done' : 'pend') + '" data-id="' + c.id + '" aria-pressed="' + (S.conf.colabId === c.id) + '">' +
        '<span class="n">' + esc(c.nome) + '</span><span class="g">' + (c.conferencia === 'gerente' ? 'Conferido pelo gerente' : esc(c.grupo)) + '</span>' +
        '<span class="s">' + (cf ? '✓ ' + (cf.tipo === 'presente' ? 'Conferido' : PRESENCA[cf.tipo]) : '○ Pendente') + '</span></button>';
    });
  });
  h += '</div>';
  if (!lista.length) h += '<div class="card empty">Nenhum colaborador ativo nesta data.</div>';
  h += '<div id="painel"></div>';
  $('#view').innerHTML = h;
  $('#savebarSlot').innerHTML = '';

  $('#dData').onchange = function () { if (this.value) { S.conf.data = this.value > hj ? hj : this.value; S.conf.edit = null; renderConf(); } };
  $('#dPrev').onclick = function () { S.conf.data = addDays(data, -1); S.conf.edit = null; renderConf(); };
  $('#dNext').onclick = function () { if (data < hj) { S.conf.data = addDays(data, 1); S.conf.edit = null; renderConf(); } };
  if ($('#dHoje')) $('#dHoje').onclick = function () { S.conf.data = hj; S.conf.edit = null; renderConf(); };
  $$('.person').forEach(function (b) { b.onclick = function () { S.conf.colabId = b.dataset.id; S.conf.edit = null; desenharConf(sem); $('#painel').scrollIntoView({ behavior: 'smooth', block: 'start' }); }; });
  if (S.conf.colabId) desenharPainel(sem, confDia[S.conf.colabId]);
}

function desenharPainel(sem, cf) {
  var data = S.conf.data, c = colab(S.conf.colabId);
  var ws = inicioSemana(data), we = addDays(ws, 6);
  var regsDia = {}; sem.registros.forEach(function (r) { if (r.data === data && r.colabId === c.id) regsDia[r.tarefaId] = r; });

  // estado de edição
  if (!S.conf.edit || S.conf.edit.key !== data + '|' + c.id) {
    var e = { key: data + '|' + c.id, tipo: cf ? cf.tipo : 'presente', obs: cf ? cf.obs : '', itens: {} };
    tarefasDo(c, data).forEach(function (t) {
      var r = regsDia[t.id];
      if (t.tipo === 'meta') e.itens[t.id] = { status: 'meta', qtd: r ? r.qtd : '', obs: r ? r.obs : '' };
      else if (t.frequencia === 'semanal') e.itens[t.id] = { status: r && r.status === 'feito' ? 'feito' : 'pendente', obs: r ? r.obs : '' };
      else e.itens[t.id] = { status: r ? r.status : 'feito', obs: r ? r.obs : '' };
    });
    S.conf.edit = e;
  }
  var E = S.conf.edit;

  var h = '<div class="card"><div class="card-h"><h3>' + esc(c.nome) + ' <span class="muted" style="font-weight:500">· ' + esc(c.grupo) + '</span></h3>' +
    (cf ? '<small>Conferido por ' + esc(cf.por) + ' em ' + esc(brAno(cf.em.slice(0, 10))) + ' ' + esc(cf.em.slice(11)) + '</small>' : '<small>Ainda não conferido</small>') +
    '</div><div class="card-b"><div class="eyebrow" style="margin-bottom:6px">Presença</div><div class="presence">' +
    Object.keys(PRESENCA).map(function (k) { return '<button class="seg p-' + k + '" data-p="' + k + '" aria-pressed="' + (E.tipo === k) + '">' + PRESENCA[k] + '</button>'; }).join('') +
    '</div>';
  if (E.tipo !== 'presente') {
    h += '<label class="f" style="margin-top:10px">Observação<input class="inp" id="pObs" value="' + esc(E.obs) + '" placeholder="' + (E.tipo === 'falta_justificada' ? 'Ex.: atestado médico de 1 dia' : 'Opcional') + '"></label>';
    h += '<div class="notice info">' + ({ folga: 'Folga não entra no placar.', falta_justificada: 'Falta com atestado não entra no placar.', falta_sem_motivo: 'Falta sem motivo conta todas as obrigações do dia como não feitas.' })[E.tipo] + '</div>';
  } else {
    agruparBlocos(tarefasDo(c, data)).forEach(function (b) {
      h += '<div class="bloco"><h4>' + esc(b.bloco) + '</h4>';
      b.tarefas.forEach(function (t) { h += linhaTarefa(t, E.itens[t.id], sem, c, data, ws, we); });
      h += '</div>';
    });
    if (!tarefasDo(c, data).length) h += '<div class="empty">Nenhuma obrigação cadastrada para a função ' + esc(c.grupo) + '.</div>';
  }
  h += '</div></div>';
  $('#painel').innerHTML = h;

  $$('#painel .seg').forEach(function (b) { b.onclick = function () { E.tipo = b.dataset.p; desenharPainel(sem, cf); }; });
  if ($('#pObs')) $('#pObs').oninput = function () { E.obs = this.value; };
  $$('#painel .tri button').forEach(function (b) {
    b.onclick = function () { E.itens[b.dataset.t].status = b.dataset.s; desenharPainel(sem, cf); };
  });
  $$('#painel .stp').forEach(function (b) {
    b.onclick = function () {
      var it = E.itens[b.dataset.t], v = Math.max(0, (Number(it.qtd) || 0) + Number(b.dataset.d));
      it.qtd = String(v); desenharPainel(sem, cf);
    };
  });
  $$('#painel .meta-inp input').forEach(function (i) { i.oninput = function () { E.itens[i.dataset.t].qtd = i.value.replace(/\D/g, ''); atualizarBarra(); }; });
  $$('#painel .obs-btn').forEach(function (b) { b.onclick = function () { E.itens[b.dataset.t].abrirObs = true; desenharPainel(sem, cf); var i = $('#obs_' + b.dataset.t); if (i) i.focus(); }; });
  $$('#painel .obs-in input').forEach(function (i) { i.oninput = function () { E.itens[i.dataset.t].obs = i.value; }; });

  // barra de salvar
  $('#savebarSlot').innerHTML = '<div class="savebar"><div class="wrap"><div id="sbResumo" class="num" style="font-size:14px"></div><div class="row">' +
    (cf ? '<button class="btn danger sm" id="bApagar">Apagar</button>' : '') +
    '<button class="btn primary" id="bSalvar">' + (cf ? 'Atualizar conferência' : 'Salvar conferência') + '</button></div></div></div>';
  atualizarBarra();
  $('#bSalvar').onclick = function () { salvarConf(c, cf); };
  if ($('#bApagar')) $('#bApagar').onclick = function () {
    confirmar('Apagar a conferência de ' + c.nome + ' em ' + brAno(data) + '?', 'Apagar', function () {
      carregando(true);
      api('excluirConferencia', S.token, data, c.id).then(function () {
        delete S.conf.semana[inicioSemana(data)]; S.conf.edit = null; carregando(false); toast('Conferência apagada'); renderConf();
      }).catch(falhaApi);
    });
  };
}

function linhaTarefa(t, it, sem, c, data, ws, we) {
  var obsBtn = '<button class="obs-btn" data-t="' + t.id + '">' + (it.obs ? 'Editar observação' : '+ Observação') + '</button>';
  var obsIn = (it.abrirObs || it.obs) ? '<div class="obs-in"><input class="inp" id="obs_' + t.id + '" data-t="' + t.id + '" value="' + esc(it.obs) + '" placeholder="Motivo ou comentário"></div>' : '';
  if (t.tipo === 'meta') {
    var meta = Number(t.meta) || 1, q = it.qtd === '' ? null : Number(it.qtd);
    var falhou = q !== null && q < meta;
    return '<div class="task' + (falhou ? ' falhou' : '') + '"><div class="d">' + esc(t.descricao) + '<small>Meta: ' + meta + ' por dia · ' + (q === null ? 'informe quantos foram feitos' : (q >= meta ? '✓ meta batida' : '✕ faltaram ' + (meta - q))) + ' · ' + obsBtn + '</small></div>' +
      '<div class="meta-inp"><button class="stp" data-t="' + t.id + '" data-d="-1" aria-label="Menos">−</button>' +
      '<input class="inp num" inputmode="numeric" data-t="' + t.id + '" value="' + esc(it.qtd) + '" placeholder="0" aria-label="Quantidade feita">' +
      '<button class="stp" data-t="' + t.id + '" data-d="1" aria-label="Mais">+</button><span class="muted num">/ ' + meta + '</span></div>' + obsIn + '</div>';
  }
  if (t.frequencia === 'semanal') {
    var feitoEm = null;
    sem.registros.forEach(function (r) { if (r.colabId === c.id && r.tarefaId === t.id && r.status === 'feito' && r.data !== data && r.data >= ws && r.data <= we) feitoEm = r.data; });
    if (feitoEm) return '<div class="task"><div class="d">' + esc(t.descricao) + '<small>Tarefa semanal</small></div><span class="pill good">✓ Feita em ' + br(feitoEm) + '</span></div>';
    return '<div class="task"><div class="d">' + esc(t.descricao) + '<small>Tarefa semanal · se não for feita até domingo (' + br(we) + '), conta 1 falha · ' + obsBtn + '</small></div>' +
      '<div class="tri"><button class="ok" data-t="' + t.id + '" data-s="feito" aria-pressed="' + (it.status === 'feito') + '">Feita hoje</button>' +
      '<button class="na" data-t="' + t.id + '" data-s="pendente" aria-pressed="' + (it.status !== 'feito') + '">Ainda não</button></div>' + obsIn + '</div>';
  }
  var cond = t.tipo === 'condicional';
  return '<div class="task' + (it.status === 'nao_feito' ? ' falhou' : '') + '"><div class="d">' + esc(t.descricao) + '<small>' + (cond ? 'Pode não se aplicar em alguns dias · ' : '') + obsBtn + '</small></div>' +
    '<div class="tri"><button class="ok" data-t="' + t.id + '" data-s="feito" aria-pressed="' + (it.status === 'feito') + '" aria-label="Feito">✓ Feito</button>' +
    '<button class="no" data-t="' + t.id + '" data-s="nao_feito" aria-pressed="' + (it.status === 'nao_feito') + '" aria-label="Não fez">✕ Não fez</button>' +
    (cond ? '<button class="na" data-t="' + t.id + '" data-s="na" aria-pressed="' + (it.status === 'na') + '" aria-label="Não se aplica">Não se aplica</button>' : '') +
    '</div>' + obsIn + '</div>';
}

function atualizarBarra() {
  var E = S.conf.edit, el = $('#sbResumo'); if (!el) return;
  if (E.tipo !== 'presente') { el.innerHTML = '<b>' + PRESENCA[E.tipo] + '</b>'; return; }
  var c = colab(S.conf.colabId), nao = 0, semMeta = 0;
  tarefasDo(c, S.conf.data).forEach(function (t) {
    var it = E.itens[t.id]; if (!it) return;
    if (t.tipo === 'meta') { if (it.qtd === '') semMeta++; else if (Number(it.qtd) < (Number(t.meta) || 1)) nao++; }
    else if (it.status === 'nao_feito') nao++;
  });
  el.innerHTML = (nao ? '<span style="color:var(--crit);font-weight:700">' + nao + ' não feita' + (nao > 1 ? 's' : '') + '</span>' : '<span style="color:var(--good);font-weight:700">Tudo feito</span>') +
    (semMeta ? ' <span class="muted">· ' + semMeta + ' meta' + (semMeta > 1 ? 's' : '') + ' sem número</span>' : '');
}

function salvarConf(c, cf) {
  var E = S.conf.edit, data = S.conf.data, itens = [];
  if (E.tipo === 'presente') {
    var faltando = [];
    tarefasDo(c, data).forEach(function (t) {
      var it = E.itens[t.id]; if (!it) return;
      if (t.tipo === 'meta') {
        if (it.qtd === '') { faltando.push(t.descricao); return; }
        itens.push({ tarefaId: t.id, status: 'meta', qtd: Number(it.qtd), obs: it.obs || '' });
      } else if (t.frequencia === 'semanal') {
        if (it.status === 'feito' || it.obs) itens.push({ tarefaId: t.id, status: it.status === 'feito' ? 'feito' : 'pendente', qtd: '', obs: it.obs || '' });
      } else if (it.status !== 'feito' || it.obs) {
        itens.push({ tarefaId: t.id, status: it.status, qtd: '', obs: it.obs || '' });
      }
    });
    if (faltando.length) { toast('Informe a quantidade de: ' + faltando.join(', '), true); return; }
  }
  carregando(true);
  api('salvarConferencia', S.token, data, c.id, { tipo: E.tipo, obs: E.obs || '' }, itens).then(function () {
    delete S.conf.semana[inicioSemana(data)];
    S.conf.edit = null; carregando(false); toast('Conferência de ' + c.nome + ' salva');
    // passa para o próximo pendente
    return carregarSemana(data).then(function (sem) {
      var feitos = {}; sem.conferencias.forEach(function (x) { if (x.data === data) feitos[x.colabId] = true; });
      var prox = S.base.colaboradores.filter(function (x) { return ativoEm(x, data) && x.ativo === 'sim' && !feitos[x.id]; })[0];
      S.conf.colabId = prox ? prox.id : null;
      desenharConf(sem); window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }).catch(falhaApi);
}

/* ---------------- PLACAR ---------------- */
function periodoPreset(p) {
  var hj = hoje(), d = parse(hj);
  if (p === 'semana') return [inicioSemana(hj), fimSemana(hj)];
  if (p === 'semanaPassada') { var s = addDays(inicioSemana(hj), -7); return [s, addDays(s, 6)]; }
  if (p === 'mes') return [iso(new Date(d.getFullYear(), d.getMonth(), 1)), iso(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
  if (p === 'mesPassado') return [iso(new Date(d.getFullYear(), d.getMonth() - 1, 1)), iso(new Date(d.getFullYear(), d.getMonth(), 0))];
  return [S.placar.ini, S.placar.fim];
}

function renderPlacar() {
  var P = S.placar;
  if (P.preset !== 'custom') { var r = periodoPreset(P.preset); P.ini = r[0]; P.fim = r[1]; }
  var visiveis = S.base.colaboradores.filter(function (c) { return P.desligados || c.ativo === 'sim'; });
  var presets = [['semana', 'Esta semana'], ['semanaPassada', 'Semana passada'], ['mes', 'Este mês'], ['mesPassado', 'Mês passado'], ['custom', 'Escolher datas']];
  var h = '<div class="filters">' +
    '<div><div class="eyebrow" style="margin-bottom:5px">Período</div><div class="chips">' +
      presets.map(function (p) { return '<button data-p="' + p[0] + '" aria-pressed="' + (P.preset === p[0]) + '">' + p[1] + '</button>'; }).join('') + '</div></div>' +
    (P.preset === 'custom' ? '<label class="f">De<input class="inp" type="date" id="fIni" value="' + P.ini + '"></label><label class="f">Até<input class="inp" type="date" id="fFim" value="' + P.fim + '"></label>' : '') +
    '<label class="f" style="min-width:190px">Colaborador<select class="inp" id="fColab"><option value="">Toda a equipe</option>' +
      visiveis.map(function (c) { return '<option value="' + c.id + '"' + (P.colabId === c.id ? ' selected' : '') + '>' + esc(c.nome) + (c.ativo !== 'sim' ? ' (desligado)' : '') + '</option>'; }).join('') + '</select></label>' +
    '<label class="row" style="gap:6px;font-size:13.5px;font-weight:600;color:var(--ink-2);padding-bottom:9px"><input type="checkbox" id="fDesl"' + (P.desligados ? ' checked' : '') + '> Mostrar desligados</label>' +
  '</div><div id="placarBody"><div class="card empty">Calculando…</div></div>';
  $('#view').innerHTML = h;
  $('#savebarSlot').innerHTML = '';
  $$('.filters .chips button').forEach(function (b) { b.onclick = function () {
    P.preset = b.dataset.p; if (P.preset === 'custom' && !P.ini) { P.ini = addDays(hoje(), -29); P.fim = hoje(); } renderPlacar(); }; });
  if ($('#fIni')) { $('#fIni').onchange = function () { if (this.value) { P.ini = this.value; if (P.fim < P.ini) P.fim = P.ini; renderPlacar(); } };
    $('#fFim').onchange = function () { if (this.value) { P.fim = this.value; if (P.fim < P.ini) P.ini = P.fim; renderPlacar(); } }; }
  $('#fColab').onchange = function () { P.colabId = this.value; renderPlacar(); };
  $('#fDesl').onchange = function () { P.desligados = this.checked; if (!P.desligados && P.colabId && colab(P.colabId).ativo !== 'sim') P.colabId = ''; renderPlacar(); };

  api('carregarPeriodo', S.token, inicioSemana(P.ini), fimSemana(P.fim)).then(function (dados) {
    var lista = P.colabId ? [colab(P.colabId)] : visiveis.filter(function (c) {
      return (!c.admissao || c.admissao <= P.fim) && (!c.desligamento || c.desligamento >= P.ini);
    });
    desenharPlacar(calcularPlacar(P.ini, P.fim, dados, lista));
  }).catch(falhaApi);
}

function statusPct(p) {
  if (p == null) return { cls: 'neu', icon: '–', txt: 'Sem dados' };
  if (p >= 0.95) return { cls: 'good', icon: '✓', txt: 'Ótimo' };
  if (p >= 0.85) return { cls: 'warn', icon: '!', txt: 'Atenção' };
  return { cls: 'crit', icon: '✕', txt: 'Crítico' };
}
function pctTxt(p) { return p == null ? '—' : (Math.round(p * 1000) / 10).toString().replace('.', ',') + '%'; }

function desenharPlacar(R) {
  var P = S.placar, um = !!P.colabId;
  var tot = R.pessoas.reduce(function (a, p) {
    a.oport += p.oport; a.feitas += p.feitas; a.falhas += p.falhas; a.sm += p.faltasSM; a.j += p.faltasJ; a.fol += p.folgas; a.pend += p.pendentes; return a;
  }, { oport: 0, feitas: 0, falhas: 0, sm: 0, j: 0, fol: 0, pend: 0 });
  var pct = tot.oport ? tot.feitas / tot.oport : null, st = statusPct(pct);
  var tarefasRank = Object.keys(R.porTarefa).map(function (k) { var p = k.split('|'); return { d: p[0], b: p[1], n: R.porTarefa[k] }; })
    .sort(function (a, b) { return b.n - a.n || a.d.localeCompare(b.d); });
  var top = tarefasRank[0];
  var periodoTxt = brAno(P.ini) + ' a ' + brAno(P.fim);

  var h = '<div class="kpis">' +
    '<div class="card kpi hero"><div class="l">Cumprimento ' + (um ? 'de ' + esc(R.pessoas[0].c.nome) : 'da equipe') + '</div><div class="v num">' + pctTxt(pct) + '</div>' +
      '<div class="x num">' + tot.feitas + ' de ' + tot.oport + ' obrigações · ' + periodoTxt + '</div></div>' +
    '<div class="card kpi"><div class="l">Obrigações não feitas</div><div class="v num" style="color:' + (tot.falhas ? 'var(--crit)' : 'var(--good)') + '">' + tot.falhas + '</div>' +
      '<div class="x"><span class="pill ' + st.cls + '">' + st.icon + ' ' + st.txt + '</span></div></div>' +
    '<div class="card kpi"><div class="l">Faltas</div><div class="v num">' + tot.sm + ' <small>sem motivo</small></div>' +
      '<div class="x num">' + tot.j + ' justificada' + (tot.j === 1 ? '' : 's') + ' · ' + tot.fol + ' folga' + (tot.fol === 1 ? '' : 's') + '</div></div>' +
    '<div class="card kpi"><div class="l">Mais esquecida</div>' + (top ? '<div class="long">' + esc(top.d) + '</div><div class="x num">' + top.n + ' vez' + (top.n > 1 ? 'es' : '') + ' · ' + esc(top.b) + '</div>' : '<div class="long" style="color:var(--good)">Nenhuma</div><div class="x">Nada deixado de fazer</div>') + '</div>' +
  '</div>';
  if (tot.pend) h += '<div class="notice info" style="margin:-4px 0 14px">⚠ ' + tot.pend + ' dia' + (tot.pend > 1 ? 's' : '') + ' de colaborador ainda sem conferência neste período. Eles não entram no placar até serem conferidos.</div>';

  // Ranking
  h += '<div class="grid2"><div class="card"><div class="card-h"><h3>' + (um ? 'Resumo' : 'Placar da equipe') + '</h3><small>' + (um ? '' : 'Clique em um nome para ver o detalhe') + '</small></div><div class="card-b scroll"><table class="rank"><thead><tr><th></th><th>Colaborador</th><th>Cumprimento</th><th class="num">Não fez</th><th class="num hide-sm">Faltas</th></tr></thead><tbody>';
  R.pessoas.forEach(function (p, i) {
    var s = statusPct(p.pct), w = p.pct == null ? 0 : Math.round(p.pct * 100);
    var cor = s.cls === 'good' ? 'var(--good)' : s.cls === 'warn' ? 'var(--warn)' : s.cls === 'crit' ? 'var(--crit)' : 'var(--ink-3)';
    h += '<tr class="' + (um ? '' : 'click') + '" data-id="' + p.c.id + '"><td class="pos num">' + (p.pct == null ? '' : (i + 1) + 'º') + '</td>' +
      '<td class="who"><b>' + esc(p.c.nome) + (p.pct === 1 && p.oport ? ' <span class="pill gold">★ 100%</span>' : '') + '</b><span>' + esc(p.c.grupo) + (p.c.ativo !== 'sim' ? ' · desligado' : '') + '</span></td>' +
      '<td style="min-width:130px"><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="track" style="flex:1" data-tip="' + esc(p.c.nome) + ': ' + p.feitas + ' de ' + p.oport + ' feitas"><i style="width:' + w + '%;background:' + cor + '"></i></div>' +
      '<span class="num" style="font-weight:700;font-size:13px;min-width:48px;text-align:right">' + pctTxt(p.pct) + '</span></div></td>' +
      '<td class="num" style="font-weight:700;color:' + (p.falhas ? 'var(--crit)' : 'var(--ink-3)') + '">' + p.falhas + '</td>' +
      '<td class="num hide-sm" data-tip="' + p.faltasSM + ' sem motivo · ' + p.faltasJ + ' justificada(s) · ' + p.folgas + ' folga(s)">' + (p.faltasSM + p.faltasJ) + '</td></tr>';
  });
  h += '</tbody></table>' + (!R.pessoas.length ? '<div class="empty">Ninguém no período.</div>' : '') + '</div></div>';

  // Mais esquecidas
  var max = top ? top.n : 1;
  h += '<div class="card"><div class="card-h"><h3>Obrigações mais esquecidas</h3><small>vezes não feitas</small></div><div class="card-b">';
  if (!tarefasRank.length) h += '<div class="empty">Nenhuma obrigação deixada de fazer no período.</div>';
  tarefasRank.slice(0, 8).forEach(function (t) {
    h += '<div class="hb" data-tip="' + esc(t.d) + '<br>' + esc(t.b) + ': ' + t.n + 'x"><div class="t">' + esc(t.d) + ' <small>· ' + esc(t.b) + '</small></div><div class="c num">' + t.n + '</div>' +
      '<div class="track"><i style="width:' + Math.max(3, t.n / max * 100) + '%"></i></div></div>';
  });
  h += '</div></div></div>';

  // Mapa de calor + semanas
  var maxHeat = 0; R.pessoas.forEach(function (p) { p.heat.forEach(function (v) { if (v > maxHeat) maxHeat = v; }); });
  function heatCor(v) { if (!v) return 'var(--h0)'; var r = v / maxHeat; return r <= .25 ? 'var(--h1)' : r <= .5 ? 'var(--h2)' : r <= .75 ? 'var(--h3)' : 'var(--h4)'; }
  function heatTxt(v) { if (!v) return 'var(--ink-3)'; var r = v / maxHeat; return r > .5 ? '#fff' : 'var(--ink)'; }
  h += '<div class="grid2"><div class="card"><div class="card-h"><h3>Em que dia da semana mais falha</h3><small>obrigações não feitas</small></div><div class="card-b heat"><table><thead><tr><th></th>' +
    DIAS.map(function (d) { return '<th>' + d + '</th>'; }).join('') + '</tr></thead><tbody>';
  R.pessoas.forEach(function (p) {
    h += '<tr><th class="nm">' + esc(p.c.nome) + '</th>' + p.heat.map(function (v, i) {
      return '<td class="num" style="background:' + heatCor(v) + ';color:' + heatTxt(v) + '" data-tip="' + esc(p.c.nome) + ' · ' + DIAS_LONGO[i] + ': ' + v + ' não feita(s)">' + (v || '') + '</td>';
    }).join('') + '</tr>';
  });
  var cols = [0, 0, 0, 0, 0, 0, 0]; R.pessoas.forEach(function (p) { p.heat.forEach(function (v, i) { cols[i] += v; }); });
  if (R.pessoas.length > 1) h += '<tr><th class="nm" style="color:var(--ink-3)">Total</th>' + cols.map(function (v) { return '<td class="num" style="color:var(--ink-2)">' + (v || '') + '</td>'; }).join('') + '</tr>';
  h += '</tbody></table><div class="legend">Menos<i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i>Mais</div></div></div>';

  var semanas = []; for (var ws = inicioSemana(P.ini); ws <= P.fim; ws = addDays(ws, 7)) semanas.push(ws);
  var maxS = 1; semanas.forEach(function (w) { maxS = Math.max(maxS, R.porSemana[w] || 0); });
  h += '<div class="card"><div class="card-h"><h3>Evolução por semana</h3><small>não feitas · semana de seg a dom</small></div><div class="card-b">';
  if (semanas.length < 2) h += '<div class="empty" style="padding:18px 8px">Escolha "Este mês", "Mês passado" ou um período maior para comparar semanas.</div>';
  else {
    h += '<div class="vbars">' + semanas.map(function (w) {
      var v = R.porSemana[w] || 0;
      return '<div class="vbar" data-tip="Semana de ' + br(w) + ' a ' + br(addDays(w, 6)) + ': ' + v + ' não feita(s)"><span class="c num">' + v + '</span><div class="bw"><div class="b" style="height:' + Math.max(1, v / maxS * 100) + '%"></div></div><span class="x num">' + br(w) + '</span></div>';
    }).join('') + '</div>';
  }
  h += '</div></div></div>';

  // Metas
  var metas = Object.keys(R.metas).map(function (k) { return R.metas[k]; });
  if (metas.length) {
    h += '<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>Metas das caixas</h3><small>realizado × meta no período</small></div><div class="card-b metas">';
    metas.sort(function (a, b) { return a.c.nome.localeCompare(b.c.nome) || Number(a.t.ordem) - Number(b.t.ordem); }).forEach(function (m) {
      var pc = m.meta ? m.real / m.meta : 0, s = statusPct(m.batidas / (m.dias || 1));
      var cor = s.cls === 'good' ? 'var(--good)' : s.cls === 'warn' ? 'var(--warn)' : 'var(--crit)';
      h += '<div class="metarow"><div><b>' + esc(m.c.nome) + '</b> · ' + esc(m.t.descricao) + ' <span class="muted num">(' + m.batidas + ' de ' + m.dias + ' dias com meta batida)</span></div>' +
        '<div class="num" style="font-weight:700">' + m.real + ' <span class="muted" style="font-weight:500">/ ' + m.meta + '</span></div>' +
        '<div class="track"><i style="width:' + Math.min(100, pc * 100) + '%;background:' + cor + '"></i></div></div>';
    });
    h += '</div></div>';
  }

  // Detalhe
  h += '<div class="card"><div class="card-h"><h3>' + (um ? 'Tudo que ' + esc(R.pessoas[0].c.nome) + ' deixou de fazer' : 'Detalhe das obrigações não feitas') + '</h3><small class="num">' + R.falhas.length + ' registro' + (R.falhas.length === 1 ? '' : 's') + '</small></div><div class="card-b scroll scroll-y">';
  if (!R.falhas.length) h += '<div class="empty">Nada deixado de fazer no período.</div>';
  else {
    h += '<table class="detail"><thead><tr><th>Data</th>' + (um ? '' : '<th>Colaborador</th>') + '<th>Obrigação</th><th>Observação</th></tr></thead><tbody>' +
      R.falhas.map(function (f) {
        return '<tr><td class="num" style="white-space:nowrap">' + DIAS[dow(f.data)] + ' ' + br(f.data) + '</td>' + (um ? '' : '<td>' + esc(f.c.nome) + '</td>') +
          '<td>' + esc(f.t.descricao) + '<div class="muted" style="font-size:12px">' + esc(f.t.bloco) + '</div></td><td>' + (f.motivo ? esc(f.motivo) : '<span class="muted">—</span>') + '</td></tr>';
      }).join('') + '</tbody></table>';
  }
  h += '</div></div>';
  var aus = um ? R.ausencias : R.ausencias.filter(function (a) { return a.tipo !== 'folga'; });
  if (aus.length) {
    h += '<div class="card" style="margin-top:14px"><div class="card-h"><h3>' + (um ? 'Folgas e faltas' : 'Faltas da equipe') + '</h3>' + (um ? '' : '<small>folgas aparecem ao escolher um colaborador</small>') + '</div><div class="card-b scroll"><table class="detail"><thead><tr><th>Data</th>' + (um ? '' : '<th>Colaborador</th>') + '<th>Tipo</th><th>Observação</th></tr></thead><tbody>' +
      aus.map(function (a) {
        var cls = a.tipo === 'falta_sem_motivo' ? 'crit' : a.tipo === 'falta_justificada' ? 'warn' : 'neu';
        return '<tr><td class="num">' + DIAS[dow(a.data)] + ' ' + br(a.data) + '</td>' + (um ? '' : '<td>' + esc(a.c.nome) + '</td>') + '<td><span class="pill ' + cls + '">' + PRESENCA[a.tipo] + '</span></td><td>' + (esc(a.obs) || '<span class="muted">—</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }
  $('#placarBody').innerHTML = h;
  $$('#placarBody tr.click').forEach(function (tr) { tr.onclick = function () { S.placar.colabId = tr.dataset.id; renderPlacar(); window.scrollTo({ top: 0, behavior: 'smooth' }); }; });
}

/* ---------------- CADASTROS (gerente) ---------------- */
function renderCad() {
  $('#savebarSlot').innerHTML = '';
  var subs = [['equipe', 'Equipe'], ['tarefas', 'Obrigações'], ['funcoes', 'Funções'], ['usuarios', 'Usuários e senhas'], ['aparencia', 'Logos']];
  var h = '<div class="subtabs chips">' + subs.map(function (s) { return '<button data-s="' + s[0] + '" aria-pressed="' + (S.cad === s[0]) + '">' + s[1] + '</button>'; }).join('') + '</div><div id="cadBody"></div>';
  $('#view').innerHTML = h;
  $$('.subtabs button').forEach(function (b) { b.onclick = function () { S.cad = b.dataset.s; renderCad(); }; });
  ({ equipe: cadEquipe, tarefas: cadTarefas, funcoes: cadFuncoes, usuarios: cadUsuarios, aparencia: cadAparencia })[S.cad]();
}

function salvarCad(fn, obj, msg) {
  carregando(true);
  return api(fn, S.token, obj).then(function (b) { S.base = b; S.conf.semana = {}; carregando(false); fecharModal(); toast(msg); renderCad(); }).catch(falhaApi);
}

function cadEquipe() {
  var cs = S.base.colaboradores.slice().sort(function (a, b) { return (a.ativo === b.ativo ? 0 : a.ativo === 'sim' ? -1 : 1) || a.nome.localeCompare(b.nome); });
  var h = '<div class="card"><div class="card-h"><h3>Equipe</h3><button class="btn primary sm" id="bNovoC">+ Novo colaborador</button></div><div class="card-b scroll"><table class="list"><thead><tr><th>Nome</th><th>Função</th><th>Quem confere</th><th>Admissão</th><th>Situação</th><th></th></tr></thead><tbody>' +
    cs.map(function (c) {
      return '<tr class="' + (c.ativo === 'sim' ? '' : 'off') + '"><td><b>' + esc(c.nome) + '</b></td><td>' + esc(c.grupo) + '</td><td>' + (c.conferencia === 'gerente' ? 'Gerente' : 'Líder') + '</td><td class="num">' + brAno(c.admissao) + '</td>' +
        '<td>' + (c.ativo === 'sim' ? '<span class="pill good">Ativo</span>' : '<span class="pill neu">Desligado em ' + brAno(c.desligamento) + '</span>') + '</td>' +
        '<td><div class="acts"><button class="btn sm" data-ed="' + c.id + '">Editar</button>' + (c.ativo === 'sim' ? '<button class="btn sm danger" data-dl="' + c.id + '">Desligar</button>' : '') + '</div></td></tr>';
    }).join('') + '</tbody></table></div></div>' +
    '<p class="muted" style="font-size:13px">Ao desligar, a pessoa sai da conferência diária a partir do dia seguinte, mas o histórico continua no placar. Quem entra no lugar recebe as obrigações da função automaticamente.</p>';
  $('#cadBody').innerHTML = h;
  $('#bNovoC').onclick = function () { modalColab({}); };
  $$('[data-ed]').forEach(function (b) { b.onclick = function () { modalColab(colab(b.dataset.ed)); }; });
  $$('[data-dl]').forEach(function (b) { b.onclick = function () { modalDesligar(colab(b.dataset.dl)); }; });
}

function opcoesGrupo(sel) { return S.base.grupos.map(function (g) { return '<option' + (g === sel ? ' selected' : '') + '>' + esc(g) + '</option>'; }).join(''); }

function modalColab(c) {
  abrirModal('<h3>' + (c.id ? 'Editar colaborador' : 'Novo colaborador') + '</h3>' +
    '<label class="f">Nome<input class="inp" id="mNome" value="' + esc(c.nome || '') + '"></label>' +
    '<label class="f">Função<select class="inp" id="mGrupo">' + opcoesGrupo(c.grupo) + '</select></label>' +
    '<label class="f">Quem confere o checklist<select class="inp" id="mConf"><option value="lider"' + (c.conferencia !== 'gerente' ? ' selected' : '') + '>Líder (e gerente)</option><option value="gerente"' + (c.conferencia === 'gerente' ? ' selected' : '') + '>Somente o gerente</option></select></label>' +
    '<label class="f">Data de admissão<input class="inp" type="date" id="mAdm" value="' + (c.admissao || (c.id ? '' : hoje())) + '"></label>' +
    (c.id && c.ativo !== 'sim' ? '<label class="f">Data de desligamento (apague para reativar)<input class="inp" type="date" id="mDes" value="' + (c.desligamento || '') + '"></label>' : '') +
    '<div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancelar</button><button class="btn primary" id="mOk">Salvar</button></div>');
  $('#mOk').onclick = function () {
    salvarCad('salvarColaborador', { id: c.id, nome: $('#mNome').value, grupo: $('#mGrupo').value, conferencia: $('#mConf').value, admissao: $('#mAdm').value,
      desligamento: $('#mDes') ? $('#mDes').value : (c.desligamento || '') }, 'Colaborador salvo');
  };
}

function modalDesligar(c) {
  abrirModal('<h3>Desligar ' + esc(c.nome) + '</h3><p class="muted" style="margin:0">A pessoa continua no histórico do placar até a data informada.</p>' +
    '<label class="f">Último dia de trabalho<input class="inp" type="date" id="mDes" value="' + hoje() + '"></label>' +
    '<div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancelar</button><button class="btn danger" id="mOk">Desligar</button></div>');
  $('#mOk').onclick = function () {
    if (!$('#mDes').value) return toast('Informe a data.', true);
    var o = Object.assign({}, c, { desligamento: $('#mDes').value });
    salvarCad('salvarColaborador', o, c.nome + ' desligado(a)');
  };
}

function cadTarefas() {
  var g = S.cadGrupo || S.base.grupos[0];
  var ts = S.base.tarefas.filter(function (t) { return t.grupos.split(',').indexOf(g) >= 0; }).sort(function (a, b) { return Number(a.ordem) - Number(b.ordem); });
  var h = '<div class="card"><div class="card-h"><h3>Obrigações por função</h3><button class="btn primary sm" id="bNovaT">+ Nova obrigação</button></div><div class="card-b">' +
    '<div class="chips" style="margin-bottom:12px">' + S.base.grupos.map(function (x) { return '<button data-g="' + esc(x) + '" aria-pressed="' + (x === g) + '">' + esc(x) + '</button>'; }).join('') + '</div>';
  if (!ts.length) h += '<div class="empty">Nenhuma obrigação para esta função.</div>';
  agruparBlocos(ts).forEach(function (b) {
    h += '<div class="bloco"><h4>' + esc(b.bloco) + '</h4><div class="scroll"><table class="list"><tbody>' + b.tarefas.map(function (t) {
      var tags = (t.tipo === 'meta' ? '<span class="pill gold">Meta ' + t.meta + '</span> ' : t.tipo === 'condicional' ? '<span class="pill neu">Pode não se aplicar</span> ' : '') +
        (t.frequencia === 'semanal' ? '<span class="pill neu">Semanal</span> ' : '') + (t.grupos.split(',').length > 1 ? '<span class="pill neu">' + t.grupos.split(',').length + ' funções</span>' : '');
      return '<tr class="' + (t.ativo === 'sim' ? '' : 'off') + '"><td>' + esc(t.descricao) + (t.ativo === 'sim' ? '' : ' <span class="pill neu">Desativada</span>') + '<div style="margin-top:3px">' + tags + '</div></td>' +
        '<td><div class="acts"><button class="btn sm" data-up="' + t.id + '" aria-label="Subir">↑</button><button class="btn sm" data-dn="' + t.id + '" aria-label="Descer">↓</button><button class="btn sm" data-et="' + t.id + '">Editar</button></div></td></tr>';
    }).join('') + '</tbody></table></div></div>';
  });
  h += '</div></div><p class="muted" style="font-size:13px">Obrigações desativadas saem do checklist, mas o histórico continua no placar. As obrigações valem para a função: quem for contratado nela já recebe a lista.</p>';
  $('#cadBody').innerHTML = h;
  $$('[data-g]').forEach(function (b) { b.onclick = function () { S.cadGrupo = b.dataset.g; cadTarefas(); }; });
  $('#bNovaT').onclick = function () { modalTarefa({ grupos: g }); };
  $$('[data-et]').forEach(function (b) { b.onclick = function () { modalTarefa(tarefa(b.dataset.et)); }; });
  function mover(id, d) { carregando(true); api('moverTarefa', S.token, id, d).then(function (b) { S.base = b; carregando(false); cadTarefas(); }).catch(falhaApi); }
  $$('[data-up]').forEach(function (b) { b.onclick = function () { mover(b.dataset.up, -1); }; });
  $$('[data-dn]').forEach(function (b) { b.onclick = function () { mover(b.dataset.dn, 1); }; });
}

function modalTarefa(t) {
  var blocos = {}; S.base.tarefas.forEach(function (x) { blocos[x.bloco] = 1; });
  var gs = (t.grupos || '').split(',');
  abrirModal('<h3>' + (t.id ? 'Editar obrigação' : 'Nova obrigação') + '</h3>' +
    '<label class="f">Descrição<input class="inp" id="mDesc" value="' + esc(t.descricao || '') + '"></label>' +
    '<label class="f">Bloco (momento do dia)<input class="inp" id="mBloco" list="blocosL" value="' + esc(t.bloco || '') + '" placeholder="Ex.: Antes da abertura"><datalist id="blocosL">' +
      Object.keys(blocos).map(function (b) { return '<option value="' + esc(b) + '">'; }).join('') + '</datalist></label>' +
    '<div class="f"><span>Vale para as funções</span><div class="checks">' + S.base.grupos.map(function (g) {
      return '<label><input type="checkbox" class="mG" value="' + esc(g) + '"' + (gs.indexOf(g) >= 0 ? ' checked' : '') + '> ' + esc(g) + '</label>'; }).join('') + '</div></div>' +
    '<label class="f">Tipo<select class="inp" id="mTipo"><option value="simples">Feito / não feito</option><option value="condicional">Feito / não feito / não se aplica</option><option value="meta">Meta com número (ex.: 10 contatos)</option></select></label>' +
    '<label class="f" id="mMetaL">Meta por dia<input class="inp num" type="number" min="1" id="mMeta" value="' + esc(t.meta || '') + '"></label>' +
    '<label class="f">Frequência<select class="inp" id="mFreq"><option value="diaria">Todo dia</option><option value="semanal">1 vez por semana (some depois de feita)</option></select></label>' +
    (t.id ? '<label class="f">Situação<select class="inp" id="mAtivo"><option value="sim">Ativa</option><option value="nao">Desativada</option></select></label>' : '') +
    '<div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancelar</button><button class="btn primary" id="mOk">Salvar</button></div>');
  $('#mTipo').value = t.tipo || 'simples'; $('#mFreq').value = t.frequencia || 'diaria'; if ($('#mAtivo')) $('#mAtivo').value = t.ativo || 'sim';
  function vis() { $('#mMetaL').hidden = $('#mTipo').value !== 'meta'; } vis(); $('#mTipo').onchange = vis;
  $('#mOk').onclick = function () {
    var grupos = $$('.mG').filter(function (i) { return i.checked; }).map(function (i) { return i.value; }).join(',');
    salvarCad('salvarTarefa', { id: t.id, descricao: $('#mDesc').value, bloco: $('#mBloco').value, grupos: grupos, tipo: $('#mTipo').value,
      meta: $('#mMeta').value, frequencia: $('#mFreq').value, ativo: $('#mAtivo') ? $('#mAtivo').value : 'sim' }, 'Obrigação salva');
  };
}

function cadFuncoes() {

function reduzirImagem(file, cb) {
  var fr = new FileReader();
  fr.onload = function () {
    var img = new Image();
    img.onload = function () {
      var lados = [260, 200, 150, 110];
      for (var i = 0; i < lados.length; i++) {
        var fator = Math.min(1, lados[i] / Math.max(img.width, img.height));
        var cv = document.createElement('canvas'); cv.width = Math.round(img.width * fator); cv.height = Math.round(img.height * fator);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        var url = cv.toDataURL('image/png');
        if (url.length > 48000) url = cv.toDataURL('image/jpeg', 0.85);
        if (url.length <= 48000) return cb(url);
      }
      toast('Imagem grande demais. Tente um arquivo menor.', true);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
